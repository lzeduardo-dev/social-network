spring:
  application:
    name: rede-social
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rede_social}
    username: ${DB_USER:rede_social}
    password: ${DB_PASSWORD:rede_social}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

jwt:
  # Chave HMAC em Base64 (minimo 256 bits). Gere com: openssl rand -base64 32
  secret: ${JWT_SECRET}
  # Tempo de validade do token em milissegundos (padrao: 24h)
  expiration: ${JWT_EXPIRATION:86400000}
